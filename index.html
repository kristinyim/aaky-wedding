<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anshul &amp; Kristin</title>
  <meta name="description" content="The wedding of Anshul & Kristin, August 7." />
  <meta property="og:title" content="Anshul & Kristin" />
  <meta property="og:description" content="The wedding of Anshul & Kristin, August 7." />
  <meta property="og:image" content="https://kristinyim.github.io/aaky-wedding/images/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="628" />
  <meta property="og:url" content="https://kristinyim.github.io/aaky-wedding/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kristinyim.github.io/aaky-wedding/images/og.jpg" />
  <meta name="theme-color" content="#1a1714" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
  <!-- The three things the first screen needs, fetched immediately -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/GreatVibes.woff2" crossorigin />
  <link rel="preload" as="image" href="images/home-bg.jpg" />
  <link rel="preload" as="image" href="images/couple.webp" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Secondary fonts (RSVP title, thank-you text, button) load without blocking the page -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&family=Inter:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
</head>
<body>

  <!-- SCENE 1: HOME -------------------------------------------------------- -->
  <!-- Three layers, back to front: background photo → text → cutout of us.
       The text sits behind our heads like the printed card, and each layer
       repositions per screen size (see the HOME section of styles.css). -->
  <section class="scene scene-home" id="home" data-scene="home">
    <div class="bg" aria-hidden="true"></div>
    <div class="home-copy">
      <p class="eyebrow">The wedding of</p>
      <h1 class="names">Anshul <span class="amp">&amp;</span> Kristin</h1>
    </div>
    <div class="home-meta">
      <p class="date">August 7, 2027</p>
      <p class="place">Huntington Beach</p>
    </div>
    <div class="couple-wrap" aria-hidden="true">
      <img class="couple" src="images/couple.webp" alt="" decoding="async" fetchpriority="high" />
    </div>
    <div class="content home-text">
      <button class="button" type="button" data-go="rsvp">RSVP</button>
    </div>
  </section>

  <!-- SCENE 2: RSVP -------------------------------------------------------- -->
  <section class="scene scene-rsvp" id="rsvp" data-scene="rsvp" hidden>
    <div class="bg" aria-hidden="true"></div>
    <div class="content rsvp-content">
      <h2 class="rsvp-title">RSVP</h2>
      <div class="form-frame">
        <!-- Paste your Notion form's share link as the src -->
        <iframe
          id="rsvp-form"
          title="RSVP form"
          src="https://horn-vegetarian-de4.notion.site/ebd//3e3ae6bb0ce98061981fcf0fa829c3fe"
          loading="lazy"
          allow="clipboard-write"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </section>

  <!-- SCENE 3: THANK YOU --------------------------------------------------- -->
  <section class="scene scene-thanks" id="thanks" data-scene="thanks" hidden>
    <div class="bg" aria-hidden="true"></div>
    <div class="content thanks-text">
      <p class="eyebrow">see you on</p>
      <h2 class="names">thank you</h2>
      <p class="date">August 7</p>
    </div>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
